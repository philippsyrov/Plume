name: compaction send projection

on:
  push:
    branches: [codex/compaction-send-projection]

permissions:
  contents: read

concurrency:
  group: compaction-send-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verify:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Rust verification components
        run: rustup component add rustfmt clippy
      - name: Diagnose Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/clippy.log"
          echo "CLIPPY_STATUS=$status"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Clippy diagnostic failed; inspect CLIPPY_STATUS before continuing."
          fi
          exit 0
