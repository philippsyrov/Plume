name: compaction send projection

on:
  push:
    branches: [codex/compaction-send-projection]

permissions:
  contents: read

concurrency:
  group: compaction-send-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-rust:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1

    steps:
      - uses: actions/checkout@v4
      - name: Diagnose the focused durable projection tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib commands::chat::send::tests -- --test-threads=1 > "$RUNNER_TEMP/focused.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/focused.log"
          echo "FOCUSED_RUST_STATUS=$status"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Focused Rust diagnostic failed; inspect FOCUSED_RUST_STATUS before continuing."
          fi
          exit 0
