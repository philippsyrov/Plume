name: checkpoint store rust

on:
  push:
    branches:
      - codex/compaction-checkpoint-store

permissions:
  contents: read

concurrency:
  group: checkpoint-store-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      - name: Run complete Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
