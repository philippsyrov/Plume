name: checkpoint store rust

on:
  push:
    branches: [codex/compaction-checkpoint-store]

permissions:
  contents: read

concurrency:
  group: checkpoint-store-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verifier:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - uses: actions/checkout@v4
      - name: Run full verifier
        run: PLUME_FULL_VERIFY=1 ./scripts/verify.sh
