name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # Keep package-manager caching disabled for PR verification.
        # npm ci from the committed lockfile is slower, but avoids trusting a
        # shared CI cache as part of the supply-chain boundary.

      - name: Install frontend dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Enable Corepack
        if: hashFiles('pnpm-lock.yaml') != '' || hashFiles('yarn.lock') != ''
        run: corepack enable

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Install yarn dependencies
        if: hashFiles('yarn.lock') != ''
        run: yarn install --frozen-lockfile

      - name: Install Rust components
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: rustup component add rustfmt clippy

      - name: Run verify
        run: ./scripts/verify.sh

      # Temporary PR-only proof for the branch-cap correction. Removed after
      # the focused Rust regression passes; ordinary CI cadence stays cheap.
      - name: Run focused Rust session tests
        run: ./scripts/dev-env.sh bash -lc "cd src-tauri && cargo test --lib sessions::storage_tests -- --test-threads=1"

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
