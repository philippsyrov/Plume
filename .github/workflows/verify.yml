name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # cache: npm omitted on purpose: actions/setup-node fails fast when
        # the cache key (package-lock.json) is missing. Re-enable once a
        # lockfile is committed.

      - name: Install frontend dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Enable Corepack
        if: hashFiles('pnpm-lock.yaml') != '' || hashFiles('yarn.lock') != ''
        run: corepack enable

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Install yarn dependencies
        if: hashFiles('yarn.lock') != ''
        run: yarn install --frozen-lockfile

      - name: Install Rust components
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: rustup component add rustfmt clippy

      - name: Run verify
        run: ./scripts/verify.sh

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
