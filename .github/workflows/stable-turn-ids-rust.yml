name: stable turn ids rust

on:
  push:
    branches: [codex/stable-transcript-ids]

permissions:
  contents: read

concurrency:
  group: stable-turn-ids-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-rust:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - uses: actions/checkout@v4
      - name: Run library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
