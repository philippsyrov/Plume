name: compaction projection verify

on:
  push:
    branches: [codex/compaction-projection]

permissions:
  contents: read

jobs:
  full-verify:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Rust verification components
        run: rustup component add rustfmt clippy
      - name: Full verifier
        run: PLUME_FULL_VERIFY=1 ./scripts/verify.sh
