[package]
name = "plume"
version = "0.1.0"
description = "Plume desktop shell"
authors = ["Plume contributors"]
edition = "2021"
rust-version = "1.78"
# The crate ships two binaries since D129C (the desktop shell and the
# plume_bench benchmark sidecar). Without an explicit default, the
# Tauri bundler's binary selection is ambiguous and it packaged
# plume_bench as Plume.app's CFBundleExecutable — the app died on
# launch. Pin the desktop shell; smoke-app.sh asserts the bundle
# agrees, and a manifest test in lib.rs pins this line.
default-run = "plume"

# Keep the desktop binary lean.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
libc = "0.2"
sha2 = "0.10.9"
base64 = "0.22.1"
png = "0.17.16"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSError"] }
objc2-web-kit = { version = "0.3.2", features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }

[features]
# Default to a lean shell; provider features get added as adapters land.
default = []
